# for the 3dteethland dataset, we need two rotations of 180 degrees 
# for both upper and lower scans around Z axis.
upper:
  transforms:
    - type: rotate
      axis: [0, 0, 1]
      angle_deg: 180

lower:
  transforms:
    - type: rotate
      axis: [0, 0, 1]
      angle_deg: 180

# scan_normalizer_config.yaml
# ----------------------------
# Configure the affine transform pipeline for upper and lower intra-oral scans.
# Transforms are applied in the order listed (top → bottom) during forward
# normalisation, and in reverse order with inverted matrices during
# apply_inverse().
#
# Supported transform types:
#   translate  – rigid translation
#   rotate     – axis-angle rotation (angle in degrees)
#   scale      – uniform (scalar) or non-uniform (list of 3) scaling
#   matrix     – arbitrary 4×4 row-major homogeneous matrix

#Centre the scan at the origin
