services:
  autobonding:
    build: .
    image: autobonding:latest
    container_name: autobonding-monitor
    gpus:
      - device: 0
    shm_size: "8gb"
    volumes:
      - ./application/data:/workspace/application/data
      - ./application/data_debug:/workspace/application/data_debug
      - ./run_monitor_map_new.sh:/workspace/run_monitor_map_new.sh
      - ./run_monitor_debug.sh:/workspace/run_monitor_debug.sh
    environment:
      - PYTHONPATH=/workspace
      - DISPLAY=:99
      - API_TOKEN=${API_TOKEN}
    command: bash /workspace/run_monitor.sh
